---
# Qwen3.8-27B in NVFP4 — Blackwell-class GPUs (RTX PRO 6000 or B200). ~22 GB weights. Same dense
# hybrid backbone as qwen38.yml (64 layers, 48 of them linear attention), native 262,144 context.
# Quantization is auto-detected (no --quantization flag).
#
# CHECKPOINT CHOICE. The other NVFP4 profiles here use nvidia/ ModelOpt builds; this one uses
# unsloth/, the build the vLLM recipe verified on consumer Blackwell (sm120) and the one that leaves
# most room for KV. Measured at 262,144 context on RTX 5090 (TP2), from
# recipes.vllm.ai/Qwen/Qwen3.8-27B:
#     build                    KV tokens   weights/GPU   MTP acceptance
#     Qwen FP8                   377,456     14.28 GiB   0.771
#     Inferact NVFP4             445,875     12.02 GiB   0.897
#     unsloth NVFP4              920,517     10.64 GiB   0.788
# unsloth is mixed-precision (FP8 channel-wise alongside the 4-bit groups), hence roughly double the
# KV pool; the uniform-W4A4 Inferact build drafts better. Both serve correctly.
# nvidia/Qwen3.8-27B-NVFP4 (ModelOpt v0.48.0, mixed NVFP4/FP8) exists but has no published sm120
# run — swap model_repo to stay on the ModelOpt line.
#
# RUNS ON RTX PRO 6000, unlike the NVFP4 *MoE* profiles here, because it is dense: vLLM selects
# FlashInferCutlassNvFp4LinearKernel on sm120, a real CUTLASS kernel rather than an emulation
# fallback, and the grouped block-scaled GEMM that breaks NVFP4 MoE on cc 12.0 is not on this path.
# vLLM also auto-disables DeepGemm for model_type qwen3_5_text on Blackwell, so no VLLM_USE_DEEP_GEMM=0
# workaround is needed.
#
# No --enforce-eager: the recipe needed it only on a single 31.4 GiB RTX 5090, where ~22 GB of
# weights left nothing for CUDA graph capture. A 96 GB RTX PRO 6000 or 179 GB B200 has room. Add it
# back for a smaller card — capture allocates outside the --gpu-memory-utilization budget and OOMs
# there however that fraction is set.
#
# --reasoning-parser qwen3 is not optional (the chat template opens every turn with <think>).
# --tool-call-parser is qwen3_xml for this generation. --language-model-only drops the vision tower.
#
# MTP: the checkpoint carries a Multi-Token Prediction head (measured acceptance 0.788 here). Left
# off so the first validation run tests the model alone. Enable with:
#   extra_vllm_args += ["--speculative-config", '{"method":"mtp","num_speculative_tokens":3}']
# Unsloth suggests 2 speculative tokens for NVFP4; the recipe measured 3. Read
# vllm:spec_decode_num_{accepted,draft}_tokens_total to confirm the drafter is used.
model_repo: "unsloth/Qwen3.8-27B-NVFP4"
served_name: "qwen3.8-27b-nvfp4"
tensor_parallel_size: 1
max_model_len: 262144
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--language-model-only"
  - "--reasoning-parser"
  - "qwen3"
  - "--tool-call-parser"
  - "qwen3_xml"
  - "--enable-auto-tool-choice"
  - "--kv-cache-dtype"
  - "fp8"
min_plan: "GPU-16xCPU-80GB-1xRTXPRO6000"
min_vram_gb: 40                  # ~22 GB weights + KV; keeps an L4/L40S-sized card out
min_disk_gb: 110   # disk size to provision: (weights_gb + 80) / 0.934
weights_gb: 22   # measured 2026-09-20 from the HF file listing (sum of .siblings[].size)
min_compute_capability: 10.0     # NVFP4 needs Blackwell: B200 (cc 10.0) or RTX PRO 6000 (cc 12.0)
validated: true    # live run 2026-09-20 on 1x RTX PRO 6000 (spot) — see docs/validation.md
# MEASURED 2026-09-20 on GPU-SPOT-16xCPU-80GB-1xRTXPRO6000 (driver 595.58.03, cc 12.0):
#   KV pool 1,902,460 tokens · 7.26x concurrency at 262,144 · 88,087/97,887 MiB
#   FLASHINFER attention backend · CUDA graphs PIECEWISE+FULL in 9 s (1.55 GiB) · engine init 123.9 s
#   soak 3x20 @32768: factual 6/6, traps 2/2 declined, 60/60 needles, 0 wrong/rejected/timed-out
#   ceiling: 65,429 / 130,803 / 259,512 prompt_tokens all PASS, container restart count unchanged.
# max_model_len 262144 is therefore MEASURED, not inherited from the recipe. The dense NVFP4 path
# takes a real CUTLASS kernel on sm120 as this profile predicted — no sign of vllm#54189 (which
# would show as one token repeated), and none expected: that issue closed 2026-08-30.                 # newly added — no live run on this account yet
