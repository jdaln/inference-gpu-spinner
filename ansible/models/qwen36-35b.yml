---
# Qwen3.6-35B-A3B (MoE: 35B total / 3B active, multimodal) in FP8 (fine-grained block-128).
# ~37.5 GB weights; at the default context total lands ~46-52 GB, so it needs an H100 80GB for a
# clean fit (L40S only with sharply reduced --max-model-len / --max-num-seqs). Quant auto-detected.
# --language-model-only drops the vision tower; --enforce-eager guards the hybrid linear-attention
# (Mamba) state cache. On B200 you can drop --enforce-eager and raise ctx/seqs. Live-validated on
# H100 2026-07-04 (262144 ctx, KV 3.42M tok, 13.03x, 74/81 GiB) — see docs/validation.md.
# H100 80 GB (1.79 EUR/h) is the validated floor and stays the recommended tier. A 1x RTX PRO 6000
# (96 GB, 1.65 EUR/h) also clears the VRAM gate and is slightly cheaper with more headroom, but has
# not been measured for this profile — the deploy warns and serves. GPU prices move; keep both.
model_repo: "Qwen/Qwen3.6-35B-A3B-FP8"
served_name: "qwen3.6-35b-a3b-fp8"
tensor_parallel_size: 1
max_model_len: 262144
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--language-model-only"
  - "--trust-remote-code"
  - "--reasoning-parser"
  - "qwen3"
  - "--tool-call-parser"
  - "qwen3_coder"
  - "--enable-auto-tool-choice"
  - "--enforce-eager"
  - "--kv-cache-dtype"
  - "fp8"
min_plan: "GPU-12xCPU-240GB-1xH100"
min_vram_gb: 76
untested_compute_capabilities: [12.0]   # runs on RTX PRO 6000, not yet measured there
health_wait_retries: 120   # x10s = 20 min — 37.5 GB download + MoE load took ~15 min cold
