---
# Qwen3.8-27B in FP8 (official Qwen block-scaled build, ~31 GB weights, Apache-2.0).
# Dense 27B on the Qwen3.5 hybrid backbone: 64 layers as 16 x (3 x Gated DeltaNet -> FFN, then
# 1 x Gated Attention -> FFN), so only 16 run full attention (full_attention_interval 4). Native
# 262,144 context, 1M with YaRN. Multimodal (image + video) and thinking-capable. Quantization is
# auto-detected from the checkpoint config (no --quantization flag).
#
# --reasoning-parser qwen3 is not optional: the chat template opens every assistant turn with
# <think>, so without it the reasoning block lands in message.content and a short max_tokens budget
# is spent before the answer starts (recipes.vllm.ai/Qwen/Qwen3.8-27B).
# --tool-call-parser is qwen3_xml for this generation, not the qwen3_coder qwen36-35b uses.
# --language-model-only drops the vision tower and measurably enlarges the KV pool (recipe:
# 91,022 -> 135,926 tokens at 32K on a 31.4 GiB card).
# --enforce-eager is here for the same reason as on qwen36: on a 48 GB L40S, CUDA graph capture
# allocates outside the --gpu-memory-utilization budget, so a tight fit dies in capture however that
# fraction is set. Drop it on a 96 GB RTX PRO 6000 or a B200.
#
# max_model_len 131072 against a native 262,144 is a measured choice, not a cautious one — the
# MEASURED block at the foot of this file has both settings on the L40S lane. For context, FP8
# weights are ~31 GB against an L40S's ~46 GiB usable, between qwen36 (27 GB, serves 262144 here)
# and gemma4-31b (33 GB, capped to 65536).
#
# MTP: the checkpoint carries a Multi-Token Prediction head that works in every precision (measured
# acceptance 0.771 for FP8). Left off so the first validation run tests the model alone — a failure
# with speculation on does not tell you which half broke. Enable with:
#   extra_vllm_args += ["--speculative-config", '{"method":"mtp","num_speculative_tokens":3}']
# and read vllm:spec_decode_num_{accepted,draft}_tokens_total to confirm the drafter is used.
#
# Sampling (model card, for callers — not set here): thinking mode temperature 1.0, top_p 0.95,
# top_k 20; non-thinking 0.7 / 0.80 / 20 with presence_penalty 1.5. Reasoning depth is per request
# via chat_template_kwargs {"reasoning_effort": "xhigh|medium|low"}.
model_repo: "Qwen/Qwen3.8-27B-FP8"
served_name: "qwen3.8-27b-fp8"
tensor_parallel_size: 1
max_model_len: 131072
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--language-model-only"
  - "--reasoning-parser"
  - "qwen3"
  - "--tool-call-parser"
  - "qwen3_xml"
  - "--enable-auto-tool-choice"
  - "--enable-prefix-caching"
  - "--enforce-eager"
  - "--max-num-batched-tokens=2048"
  - "--max-num-seqs=16"
  - "--kv-cache-dtype"
  - "fp8"
min_plan: "GPU-8xCPU-64GB-1xL40S"
min_vram_gb: 40                  # ~31 GB weights + KV; an L4's 24 GB cannot hold it
min_disk_gb: 69   # 29 GB of weights plus ~40 GB for the container image and
                   # Docker's data-root, which share this disk.
weights_gb: 29   # measured 2026-09-20 from the HF file listing (sum of .siblings[].size)
validated: true    # live runs 2026-09-20 (RTX PRO 6000) and 2026-09-21 (L40S, its own lane)
# MEASURED 2026-09-21 on GPU-SPOT-8xCPU-64GB-1xL40S (46,068 MiB, cc 8.9, driver 595.58.03), the
# lane min_plan names:
#   KV pool 359,719 tokens · 2.74x concurrency at 131,072 · 41,023/46,068 MiB
#   load 27.57 GiB in 72.9 s · engine init 51.2 s
#   soak 3x20 @32768: factual 6/6, traps 2/2, 60/60 needles, 0 wrong · p50 73.2 s
#   ceiling: 128,766 prompt_tokens passes — the full deployed context serves.
#
# WHY max_model_len STAYS 131072. Deployed at the native 262144 on the same card: KV pool 372,123,
# concurrency 1.42x, one 259,512-token request passes in 173.8 s, and three concurrent 260k requests
# all returned the correct needle with none rejected — vLLM queued a 2.1x oversubscribed pool rather
# than refusing. The slowest of those three waited 9.8 minutes, so the full window costs latency
# rather than correctness, and turns a 3-user box into a 1-user box. Take it deliberately for
# single-user or batch work:
#   bin/spin up --model qwen38 --plan GPU-8xCPU-64GB-1xL40S -e max_model_len=262144
# The 2026-09-20 run on a 96 GiB RTX PRO 6000 (KV 1,743,257, 13.30x) has 4.8x more KV and cannot be
# used to size this lane.
health_wait_retries: 120         # x10s = 20 min — ~31 GB download plus a 64-layer hybrid load
