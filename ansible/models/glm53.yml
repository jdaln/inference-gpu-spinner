---
# GLM-5.3 (Z.ai) — ~743B total / 39B active MoE, text-only, 1M native context, 5-token MTP.
# Architecture and serving flags are identical to GLM-5.2 (glm52.yml); the packaging changed, and
# the default zai-org/GLM-5.3 checkpoint is now native FP8 rather than a separate build. BF16 lives
# under zai-org/GLM-5.3-BF16. ~756 GB of weights.
#
# PINNED IMAGE. GlmMoeDsaForCausalLM is already in the shared v0.23.0 pin, but the recipe's floor
# for this model is vLLM 0.28.0: a registry hit means the code exists, the recipe says which version
# serves it. This uses v0.29.0, the newest release.
#
# 8x B200. The recipe's single-node options are 8x H200 or 8x H20 (141 GB each) for FP8, and 8x B200
# (180 GB each) to reach 1M context with an FP8 KV cache. UpCloud has neither H200 nor H20, so
# 8x B200 it is — ~36 EUR/h, the glm52 tier, hence the cost gate. 8x H100 would be 640 GB against
# ~756 GB of weights, and 8x RTX PRO 6000 768 GB with nothing left for KV and no NVLink;
# min_vram_gb keeps both out.
#
# MTP: the 5-token draft is left off so the first validation run tests the model alone — at this
# hourly rate a failure that could be either half is expensive. Enable with:
#   extra_vllm_args += ["--speculative-config", '{"method":"mtp","num_speculative_tokens":5}']
#
# DISK: ~756 GB of weights. Set WEIGHTS_SIZE_GB to at least 800 and re-run bin/spin persistent-init
# before the first pull. At MaxIOPS that is ~EUR 176/mo standing, billed whether or not a GPU
# exists. Either budget for it or let bin/spin down remove the disk each evening and accept a fresh
# ~100 min pull.
#
# An NVFP4 checkpoint exists (Inferact/GLM-5.3-NVFP4) and is not used here: NVFP4 MoE takes the
# CUTLASS grouped block-scaled GEMM path that misbehaves on RTX Blackwell, and on B200 the native
# FP8 build is what the recipe verifies.
model_repo: "zai-org/GLM-5.3"
served_name: "glm53"
vllm_image_override: "vllm/vllm-openai:v0.29.0-cu129-ubuntu2404"
tensor_parallel_size: 8
max_model_len: 1048576
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--kv-cache-dtype"
  - "fp8"
  - "--reasoning-parser"
  - "glm47"
  - "--tool-call-parser"
  - "glm47"
  - "--enable-auto-tool-choice"
min_plan: "GPU-192xCPU-1920GB-8xB200"
min_vram_gb: 175   # per-GPU floor (B200 reports 179 GB); ~756 GB of weights across TP=8
min_disk_gb: 800   # 704 GB of weights plus ~40 GB for the container image and
                   # Docker's data-root, which share this disk.
                   # Rounded up to the 800 GB floor this profile's own notes give.
weights_gb: 704   # measured 2026-09-20 from the HF file listing (sum of .siblings[].size)
validated: false   # newly added — no live run on this account yet
health_wait_retries: 800   # x10s = 133 min — ~756 GB to pull, then TP=8 init across eight GPUs
