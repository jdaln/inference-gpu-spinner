---
# DeepSeek-V4-Flash (284B-A13B MoE, text-only) in NVFP4 — Blackwell (B200) ONLY.
# Official NVIDIA ModelOpt checkpoint (157 GB on disk). VALIDATED LIVE on a SINGLE B200 at TP1
# (2026-07-04): serves at 262144 ctx with fp8 KV — KV pool 347,227 tok, 1.32x concurrency at full
# context, 170.7/179 GiB. Tight but real; lower max_model_len if you need more concurrency.
# (The FP8 build ~320 GB still needs a multi-GPU node — NVFP4-on-B200 is the single-GPU path.)
# MoE NVFP4 backend: vLLM auto-selects CUTLASS (do NOT set VLLM_USE_FLASHINFER_MOE_FP4 — it raises
# "no FlashInfer NVFP4 MoE backend supports the configuration" on this image).
model_repo: "nvidia/DeepSeek-V4-Flash-NVFP4"
served_name: "deepseek-v4-flash-nvfp4"
tensor_parallel_size: 1
max_model_len: 262144
gpu_memory_utilization: 0.92
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--trust-remote-code"
  - "--kv-cache-dtype"
  - "fp8"
  - "--tokenizer-mode"
  - "deepseek_v4"
  - "--reasoning-parser"
  - "deepseek_v4"
  - "--tool-call-parser"
  - "deepseek_v4"
  - "--enable-auto-tool-choice"
min_plan: "GPU-24xCPU-240GB-1xB200"
min_vram_gb: 175   # B200 reports 179 GB after floor-div (183,359 MiB) — measured live 2026-07-04
health_wait_retries: 120   # x10s = 20 min — 157 GB weights; download dominates a cold start
