---
# DeepSeek-V4.1-Flash — vision-language MoE, 552B backbone + 196B Engram memory, 8B active per
# prompt token and 16B per output token. 40 layers at hidden 5120, split into a 20-layer encoder and
# a 20-layer decoder (prefill runs only the encoder half), with a 32-layer ViT and aligner in front.
# Two-tier sparse attention with a V3.2-style indexer, Hyper-Connections, and a fused DSpark draft
# head. Routing is 6 of 384 experts plus one shared, with a separate routing bias for image spans.
# 1,048,576 context via YaRN factor 16 over a 65,536-token training window.
#
# NEW PROFILE — no live run on this account. validated: false makes the deploy say so.
#
# PINNED IMAGE (required): no pip wheel serves this architecture. It landed on vLLM main in
# vllm-project/vllm#56228, so any nightly from 2026-09-10 onwards carries it; v0.29.0 predates that.
# The tag below is an immutable dated nightly rather than the floating :nightly, so a spin-up two
# weeks from now gets the same engine. Replace it with a v0.30.0 release tag once one exists.
#
# MEMORY. The checkpoint is ~511 GB on disk (476 GiB) and the recipe's floor is 614 GB of VRAM,
# which is one GB200 NVL4 tray at TP4 — 4x B200 (768 GB) is the equivalent plan here. The Engram
# tables alone are 196.6B parameters (~183 GiB) and dominate everything except the experts. KV is a
# small share of that budget: weights and batch size set the capacity limit, not the cache.
#
# B200 ONLY. Routed expert weights are MXFP4, so this takes the same grouped block-scaled GEMM path
# that returns invalid output on RTX Blackwell (cc 12.0) with a cu129 build. See the NVFP4 MoE
# profiles for the same restriction and the open upstream issue.
#
# --language-model-only skips the vision encoder entirely, which drops the ViT and aligner from the
# load and frees that VRAM for KV. The verified GB200 runs (TP4 and 1P1D) were text-only, so that is
# what this profile reproduces. For image input, remove that flag and consider
# --mm-encoder-tp-mode data, which runs the ViT data-parallel: at 32 layers and hidden 1024 the
# encoder is small enough that tensor-parallel communication costs more than it saves.
#
# --tokenizer-mode / --reasoning-parser / --tool-call-parser are all deepseek_v41, not deepseek_v4.
#
# REASONING. Thinking is ON by default at effort 50. Callers control it per request via
# chat_template_kwargs: thinking (bool) and reasoning_effort, which takes low (25), high (50),
# xhigh (75), max (100) or an integer 1-100. Note the DeepSeek API maps low/high/max to 50/75/100
# while vLLM maps low/high/xhigh/max to 25/50/75/100 — pass an integer if you need parity.
#
# DSpark: the checkpoint carries a fused draft head that adds roughly 14B parameters to the load.
# Left OFF so the first validation run tests the model alone. Enable with:
#   extra_vllm_args += ["--speculative-config",
#     '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}']
#
# DISK: ~511 GB of weights against a default 150 GB /data. Set WEIGHTS_SIZE_GB to at least 600 and
# re-run bin/spin persistent-init before the first pull. At MaxIOPS that is ~EUR 132/mo standing
# while the disk exists — bin/spin down removes it by default, at the cost of a fresh ~70 min pull.
model_repo: "deepseek-ai/DeepSeek-V4.1-Flash"
served_name: "deepseek-v41-flash"
vllm_image_override: "vllm/vllm-openai:cu129-nightly-cd10ed6f9f6b37a8ace9cf380007e66fe12ec0c3"
tensor_parallel_size: 4
max_model_len: 1048576
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_env:
  # First load is very long: weights, Engram tables and CUDA graph capture. The engine's own
  # readiness timeout has to outlast it or vLLM aborts before it ever serves.
  VLLM_ENGINE_READY_TIMEOUT_S: 3600
extra_vllm_args:
  - "--language-model-only"
  - "--tokenizer-mode"
  - "deepseek_v41"
  - "--reasoning-parser"
  - "deepseek_v41"
  - "--tool-call-parser"
  - "deepseek_v41"
  - "--enable-auto-tool-choice"
  - "--max-num-seqs=128"
  - "--max-num-batched-tokens=16384"
  # Covers expected decode batches including DSpark draft tokens: 128 * (1 + 5) = 768, rounded up.
  - "--max-cudagraph-capture-size=1024"
min_plan: "GPU-48xCPU-960GB-4xB200"
min_vram_gb: 175   # per-GPU floor (B200 reports 179 GB); 614 GB total across TP=4
min_compute_capability: 10.0
unsupported_compute_capabilities: [12.0]
unsupported_reason: >-
  its MXFP4 routed experts need the CUTLASS grouped block-scaled GEMM, which returns invalid output
  on RTX Blackwell (cc 12.0) without a FlashInfer build patched against CUDA 13.0
validated: false     # newly added — no live run on this account yet
requires_review: true
health_wait_retries: 600   # x10s = 100 min — ~511 GB to pull, then TP=4 init and graph capture
