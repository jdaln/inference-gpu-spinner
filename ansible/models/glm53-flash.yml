---
# GLM-5.3-Flash (Z.ai) — ~321B total / 18B active multimodal MoE, 45 layers mixing KDA linear
# attention with NoPE sparse MLA, 8 of 288 experts per token. Image and video input, 1,048,576
# native context, one MTP draft layer. Native FP8 weights, ~306 GiB.
#
# PINNED IMAGE (required): Glm5NextForConditionalGeneration is in neither v0.23.0 nor v0.29.0 — the
# recipe says to use Docker until the integration reaches the public repo, so this pins
# vllm/vllm-openai:glm53-flash. That build also satisfies the FlashInfer 0.6.17 floor NoPE sparse
# MLA needs.
#
# 4x B200 matches the recipe's verified TP4-on-one-GB200-tray (768 GB) configuration — ~18 EUR/h,
# hence the cost gate. Hopper is supported by the implementation but cannot use an FP8 KV cache
# for this model and must run BF16 KV, so min_compute_capability pins the Blackwell path the flags
# below assume.
#
# MTP: one draft layer is in the checkpoint and the recipe's TP4 command enables it with 5 tokens.
# Left off so the first validation run tests the model alone. Enable with:
#   extra_vllm_args += ["--speculative-config", '{"method":"mtp","num_speculative_tokens":5}']
#
# Vision stays on: the recipe's command has no --language-model-only equivalent, and the multimodal
# path is part of what this model is for. Serving is text-first either way.
#
# DISK: ~328 GB of weights. Set WEIGHTS_SIZE_GB to at least 400 and re-run bin/spin persistent-init
# before the first pull. At MaxIOPS that is ~EUR 88/mo standing.
#
# NOT ON RTX PRO 6000 — use glm53-flash-nvfp4.yml, which serves the same model on 4x RTX PRO 6000 at
# 6.60 EUR/h by carrying an out-of-tree kernel. This profile stays the plain, overlay-free FP8 path.
# The MLA layers are rope-free (qk_rope_head_dim: 0) and no stock vLLM build has an SM120 kernel for
# that shape (three failure modes in vllm-project/vllm#53963). The failure also hides:
# vllm-project/vllm#55757 reports DSA models answering short prompts correctly on sm_120 and dying
# at realistic lengths, so unsupported_compute_capabilities refuses the GPU up front.
model_repo: "zai-org/GLM-5.3-Flash"
served_name: "glm53-flash"
vllm_image_override: "vllm/vllm-openai:glm53-flash"
tensor_parallel_size: 4
max_model_len: 1048576
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  # Correctness flag, not a tuning knob: this checkpoint is hybrid, and a prefix-cache hit resumes
  # its KDA layers from a recycled block's recurrent state, so a long prompt is answered fast and
  # wrong (vllm#56960). Measured 2026-09-22 — see docs/gpu-spinner.md, "Hybrid checkpoints and
  # prefix caching".
  # This profile has never had a live run, so nothing here is being retracted -- the flag is set
  # before the first EUR 18/h session rather than after it.
  - "--no-enable-prefix-caching"
  - "--kv-cache-dtype"
  - "fp8"
  - "--reasoning-parser"
  - "glm47"
  - "--tool-call-parser"
  - "glm47"
  - "--enable-auto-tool-choice"
# Hybrid attention: most layers carry recurrent state, which is what makes
# --no-enable-prefix-caching mandatory above. tests/check-prefix-caching.sh keys on this.
hybrid_recurrent_state: true
min_plan: "GPU-96xCPU-960GB-4xB200"
min_vram_gb: 175   # per-GPU floor (B200 reports 179 GB); ~306 GiB of weights across TP=4
min_disk_gb: 420   # disk size to provision: (weights_gb + 80) / 0.934
weights_gb: 306   # measured 2026-09-20 from the HF file listing (sum of .siblings[].size)
min_compute_capability: 10.0   # FP8 KV cache for this model is Blackwell-only; Hopper needs BF16 KV
unsupported_compute_capabilities: [12.0]
unsupported_reason: >-
  its rope-free sparse MLA (qk_rope_head_dim 0) has no SM120 attention or KV path in any stock vLLM
  build (vllm-project/vllm#53963), and the failure only appears at realistic prompt lengths
  (vllm-project/vllm#55757). glm53-flash-nvfp4 is the RTX PRO 6000 path
validated: false   # newly added — no live run on this account yet
health_wait_retries: 400   # x10s = 67 min — ~328 GB to pull, then TP=4 init
