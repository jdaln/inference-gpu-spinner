---
# Gemma 4 26B-A4B in NVFP4 — Blackwell (B200) ONLY. Official NVIDIA ModelOpt checkpoint (~14 GB).
# Quant auto-detected (do NOT pass --quantization). MoE NVFP4 backend: let vLLM auto-select (CUTLASS). Do NOT set VLLM_USE_FLASHINFER_MOE_FP4=1 — on this
# image it raises "no FlashInfer NVFP4 MoE backend supports the configuration" (measured live 2026-07-04).
# B200 (NVFP4 will not run on L40S/H100). Live-validated on B200 2026-07-05 (262144, KV 10.64M tok,
# 40.59x, 165.9/183 GiB; soak 6/6; CUTLASS NVFP4-MoE path confirmed).
model_repo: "nvidia/Gemma-4-26B-A4B-NVFP4"
served_name: "gemma4-26b-a4b-nvfp4"
tensor_parallel_size: 1
max_model_len: 262144
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--trust-remote-code"
  - "--limit-mm-per-prompt"
  - '{"image":0}'
  - "--enable-auto-tool-choice"
  - "--reasoning-parser"
  - "gemma4"
  - "--tool-call-parser"
  - "gemma4"
  - "--kv-cache-dtype"
  - "fp8"
min_plan: "GPU-12xCPU-240GB-1xB200"
min_vram_gb: 40                  # real weight+KV floor; the capability gates below pin the family
min_compute_capability: 10.0     # NVFP4 needs Blackwell — no L4/L40S/H100
unsupported_compute_capabilities: [12.0]
unsupported_reason: >-
  NVFP4 MoE on RTX Blackwell (cc 12.0) goes through the CUTLASS grouped block-scaled GEMM, which
  returns invalid output on the cu129 build this profile pins. RE-TEST THIS: the fault is reported
  fixed on cu130 (flashinfer-ai/flashinfer#2708, now in vLLM's FlashInfer pin), and a separate
  silent fault, vllm-project/vllm#54189, accounted for much of the same symptom. A cu130 image
  needs an r580+ host driver — check what the deploy reports as gpu_driver_major first
