---
# Qwen3.6 (current as of 2026) in FP8 (e4m3) — the hardware-adapted quant for the
# L40S (Ada / sm_89, native FP8). FP8 weights ~27 GB fit a single 48 GB L40S.
# Quantization is AUTO-DETECTED from the checkpoint config (no --quantization flag).
# Needs an L40S or larger — does NOT fit an L4 (24 GB).
model_repo: "Qwen/Qwen3.6-27B-FP8"
served_name: "qwen3.6-27b-fp8"
tensor_parallel_size: 1
# Validated on a single L40S (45 GiB usable): peaks at ~41 GiB, healthy in ~95 s.
# 27B is MULTIMODAL; the dominant memory was the profiling forward-pass activation, not the
# vision weights. The combination that fits:
#   --language-model-only        : skip the vision tower (text-only serving), per the vLLM recipe
#   --max-num-batched-tokens 2048: cap the prefill batch -> small profiling activation (key lever)
#   --max-num-seqs 16            : bound concurrency -> bounded KV/scheduler memory
#   --enforce-eager              : skip cudagraph capture for headroom + faster start
# FP8 quantization is auto-detected from the checkpoint config. For more throughput on a
# larger GPU (e.g. H100 80 GB), drop --enforce-eager and raise max-model-len / batched-tokens.
max_model_len: 262144
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--language-model-only"
  - "--reasoning-parser=qwen3"
  - "--enable-prefix-caching"
  - "--enforce-eager"
  - "--max-num-batched-tokens=2048"
  - "--max-num-seqs=16"
  # fp8 KV cache REQUIRED to fit native 262K context in the L40S KV pool (static fp8 only — do NOT add
  # --calculate-kv-scales: vLLM #37554 corrupts FP8 KV on these Gated-DeltaNet+Attention hybrids).
  - "--kv-cache-dtype"
  - "fp8"
min_plan: "GPU-8xCPU-64GB-1xL40S"
# Preflight floor (GB): an L40S reports ~44 GB. 40 blocks an accidental L4 run (which would OOM).
min_vram_gb: 40
