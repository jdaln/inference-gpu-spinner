---
# Gemma 4 31B in NVFP4 — Blackwell-class GPUs (B200 or RTX PRO 6000). Official NVIDIA ModelOpt
# checkpoint (~21 GB). Dense, so it uses the NVFP4 scaled-mm path rather than the grouped-GEMM MoE
# kernels that misbehave on RTX Blackwell — hence this one runs on cc 12.0 and the NVFP4 *MoE*
# profiles do not. Quant auto-detected (do not pass --quantization). min_compute_capability keeps it
# off L40S/H100, which have no NVFP4 support at all. Live-validated on B200 2026-07-05 (262144,
# KV 2.42M tok, 9.22x, 166/183 GiB; soak 6/6). Not yet validated on RTX PRO 6000.
model_repo: "nvidia/Gemma-4-31B-IT-NVFP4"
served_name: "gemma4-31b-nvfp4"
tensor_parallel_size: 1
max_model_len: 262144
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--limit-mm-per-prompt"
  - '{"image":0}'
  - "--enable-auto-tool-choice"
  - "--reasoning-parser"
  - "gemma4"
  - "--tool-call-parser"
  - "gemma4"
  - "--kv-cache-dtype"
  - "fp8"
min_plan: "GPU-24xCPU-240GB-1xB200"   # the validated tier; 1xRTXPRO6000 also passes, untested
min_vram_gb: 40                  # ~21 GB weights + KV; keeps an L4/L40S-sized card out
min_disk_gb: 70   # 30 GB of weights plus ~40 GB for the container image and
                   # Docker's data-root, which share this disk.
weights_gb: 30   # measured 2026-09-20 from the HF file listing (sum of .siblings[].size)
min_compute_capability: 10.0     # Blackwell or newer: B200 (cc 10.0) and RTX PRO 6000 (cc 12.0)
untested_compute_capabilities: [12.0]   # dense NVFP4 should run on RTX PRO 6000; not yet measured
