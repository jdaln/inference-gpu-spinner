---
# Gemma 4 31B in NVFP4 — Blackwell (B200) ONLY. Official NVIDIA ModelOpt checkpoint (~21 GB).
# Dense, so no FlashInfer-MoE env needed. Quant auto-detected (do NOT pass --quantization).
# min_vram_gb=175 pins this to the B200 (NVFP4 will not run on L40S/H100). Live-validated on B200
# 2026-07-05 (262144, KV 2.42M tok, 9.22x, 166/183 GiB; soak 6/6).
model_repo: "nvidia/Gemma-4-31B-IT-NVFP4"
served_name: "gemma4-31b-nvfp4"
tensor_parallel_size: 1
max_model_len: 262144
gpu_memory_utilization: 0.90
dtype: "auto"
enable_lora: false
extra_vllm_args:
  - "--limit-mm-per-prompt"
  - '{"image":0}'
  - "--enable-auto-tool-choice"
  - "--reasoning-parser"
  - "gemma4"
  - "--tool-call-parser"
  - "gemma4"
  - "--kv-cache-dtype"
  - "fp8"
min_plan: "GPU-24xCPU-240GB-1xB200"
min_vram_gb: 175   # B200 reports 179 GB after floor-div (183,359 MiB) — measured live 2026-07-04
