---
# Pull + run nvidia-smi inside the vLLM image to prove GPU passthrough end-to-end.
# Slow (pulls a large image), so off by default; enable with -e docker_gpu_smoketest=true.
docker_gpu_smoketest: false

# Persist Docker images on the /data disk (data-root) so the ~30 GB vLLM image survives teardown
# and isn't re-pulled every spin. Safely falls back to the boot disk if /data is smaller than the
# threshold (so it won't break a not-yet-resized disk). Needs the weights disk >= the threshold.
docker_data_root_on_data: true
docker_data_root_min_gb: 100
