---
# Minimum NVIDIA driver major for Blackwell-class GPUs, detected by compute capability (>= 10.0)
# rather than model name, so it covers B200 (cc 10.0) and RTX PRO 6000 (cc 12.0) without a name list
# to maintain. Older GPUs (L4/L40S cc 8.9, H100 cc 9.0) are not checked. The guard catches a stale
# UpCloud template before it fails obscurely inside vLLM/CUDA.
gpu_min_driver_blackwell: 570
gpu_blackwell_min_compute_cap: 10.0
