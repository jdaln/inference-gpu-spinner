# Self-contained Ansible config for the Inference GPU-spinner project.
# (Independent of any surrounding repo — does not read parent config or roles.)
[defaults]
inventory = ansible/inventory
roles_path = ansible/roles
callbacks_enabled = profile_tasks, timer
interpreter_python = auto_silent
retry_files_enabled = False
timeout = 60
# Ephemeral hosts get a fresh host key on every spin-up (new server, same floating IP),
# so strict host-key checking would constantly conflict. The cloud firewall already
# restricts SSH to the operator IP, so we disable it here (trust-on-each-spin-up).
host_key_checking = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
