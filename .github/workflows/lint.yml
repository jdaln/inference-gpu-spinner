name: lint
on:
  push:
  pull_request:

jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: tofu fmt -check
        run: tofu fmt -check -recursive terraform/
      - name: tofu validate (persistent)
        run: |
          tofu -chdir=terraform/persistent init -backend=false
          tofu -chdir=terraform/persistent validate
      - name: tofu validate (upcloud)
        run: |
          tofu -chdir=terraform/providers/upcloud init -backend=false
          tofu -chdir=terraform/providers/upcloud validate

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible + ansible-lint
        # From requirements.txt, so CI installs the same pinned versions the guide documents.
        run: pip install -r requirements.txt
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        run: ansible-lint
      - name: ansible syntax-check (single + multi-model)
        run: |
          ansible-playbook ansible/site.yml --syntax-check -e vllm_model=qwen36 -e sslip_host=example
          ansible-playbook ansible/site.yml --syntax-check -e vllm_model=qwen36 -e sslip_host=example -e multi_model_enabled=true
      - name: the inventory directory actually parses
        # `.ini` is in Ansible's default ignore list, so a directory inventory of .ini files
        # resolves to nothing and every play then matches no hosts while exiting 0.
        run: |
          ansible-inventory -i ansible/inventory --list > /tmp/inv.json
          jq -e 'has("gpu")' /tmp/inv.json > /dev/null
      - name: bin/spin default profile exists + every profile renders
        run: |
          default=$(sed -n 's/.*VLLM_MODEL:-\([a-z0-9-]*\).*/\1/p' bin/spin bin/lib/*.sh | head -1)
          echo "bin/spin default profile: $default"
          test -f "ansible/models/$default.yml" || { echo "::error::bin/spin defaults to missing profile '$default'"; exit 1; }
          for f in ansible/models/*.yml; do
            ansible-playbook tests/render-profile.yml -e "profile=$(basename "$f" .yml)" >/dev/null || { echo "::error::profile $f fails to render"; exit 1; }
            echo "rendered: $f"
          done
      - name: every profile's plan is a real UpCloud plan
        # bin/spin deploys min_plan / swap_plan when --plan is omitted, so a typo here reaches
        # `tofu apply` on a paid resource instead of just printing a wrong message.
        run: |
          rc=0
          check() {   # check <file> <key>
            plan=$(sed -n "s/^$2: *\"\{0,1\}\([A-Za-z0-9-]*\)\"\{0,1\}.*/\1/p" "$1" | head -1)
            [ -n "$plan" ] || return 0   # absent is allowed: bin/spin falls through to the default
            if ! grep -qE "^${plan}[[:space:]]" tests/plans.txt; then
              echo "::error file=$1::$2 '$plan' is not listed in tests/plans.txt"; rc=1
            else
              echo "$(basename "$1") -> $plan"
            fi
          }
          for f in ansible/models/*.yml; do check "$f" min_plan; done
          for f in ansible/swap-profiles/*.yml; do check "$f" swap_plan; done
          exit $rc

      - name: every swap preset resolves + renders (llama-swap)
        run: |
          for f in ansible/swap-profiles/*.yml; do
            p=$(basename "$f" .yml)
            ansible-playbook tests/render-swap-profile.yml -e "preset=$p" >/dev/null || { echo "::error::swap preset $f fails to render"; exit 1; }
            echo "rendered swap: $f"
          done

  vllm-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every profile matches the vLLM build its image pins
        # Reads vLLM's source at the ref each pinned image corresponds to and checks the
        # checkpoint's architecture, the named parsers and every CLI flag. Catches the mistakes
        # the render tests cannot: a flag that does not exist, a parser that is not registered,
        # or an architecture the pinned release predates.
        run: python3 tests/check-vllm-compat.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: for f in bin/spin bin/lib/*.sh; do bash -n "$f"; done
      - name: shellcheck
        # -x follows the `. bin/lib/*.sh` sources, so the CLI is checked as one unit.
        run: shellcheck -x bin/spin   # ubuntu-latest ships shellcheck
