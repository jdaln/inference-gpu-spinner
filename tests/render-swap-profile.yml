---
# CI guard: resolve a swap preset (ansible/swap-profiles/<name>.yml) into swap_models and render the
# llama-swap config template. Catches undefined vars / bad YAML / arg-quoting bugs without a GPU:
#   ansible-playbook tests/render-swap-profile.yml -e preset=<name>
# NOTE: validates rendering + resolution only — model flag VALUES are proven by live runs.
- name: Render a swap preset through the llama-swap template
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    swap_models_dir: "{{ playbook_dir }}/../ansible/models"
  tasks:
    - name: Load shared defaults
      ansible.builtin.include_vars: "{{ playbook_dir }}/../ansible/group_vars/all.yml"

    - name: Load the swap preset
      ansible.builtin.include_vars: "{{ playbook_dir }}/../ansible/swap-profiles/{{ preset }}.yml"

    - name: Resolve swap_profiles into swap_models
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../ansible/roles/llama_swap/tasks/resolve_models.yml"

    - name: Render the llama-swap config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../ansible/roles/llama_swap/templates/llama-swap.yaml.j2"
        dest: "/tmp/render-swap-{{ preset }}.yaml"
        mode: "0644"

    - name: Rendered config parses as YAML with one entry per model
      ansible.builtin.assert:
        that:
          - rendered.models is defined
          - (rendered.models | length) == (swap_models | length)
          - (rendered.models | length) > 0
          # Top-level keys are easy to lose to Jinja whitespace control: a `{{ '{#-' }}` before this
          # one once stripped the preceding newline and buried `healthCheckTimeout:` inside a
          # comment, which parses fine as YAML and silently reverts llama-swap to its own default.
          - rendered.healthCheckTimeout is defined
          - (rendered.healthCheckTimeout | int) >= 600
          # Every backend must carry the parallelism and dtype the profile declares. The template
          # used to omit both, so a TP=4 profile in a preset silently ran TP=1.
          - rendered.models.values() | map(attribute='cmd') | select('search', '--tensor-parallel-size') | list | length == (swap_models | length)
          - rendered.models.values() | map(attribute='cmd') | select('search', '--dtype') | list | length == (swap_models | length)
        fail_msg: "preset '{{ preset }}' renders invalid llama-swap YAML or a model-count mismatch"
      vars:
        rendered: "{{ lookup('ansible.builtin.file', '/tmp/render-swap-' ~ preset ~ '.yaml') | from_yaml }}"
