---
# CI guard: the llama_swap role must refuse a preset entry it cannot serve faithfully.
#
# Why: the llama-swap backend is a bare `docker run` (roles/llama_swap/templates/llama-swap.yaml.j2).
# It carries the image, repo, context, memory fraction, TP, dtype and extra_vllm_args — and nothing
# else. A profile that needs a per-model environment variable or an out-of-tree plugin overlay would
# start and serve with that setting silently absent, which is worse than not deploying: the failure
# signature for a zeroed NVFP4 MoE (vllm-project/vllm#54189) is one token repeated, and that reads
# as a bad model rather than a bad deployment.
#
# Run:  ansible-playbook tests/swap-refusals.yml
- name: A preset entry needing extra_env / vllm_plugins is refused
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    swap_models_dir: "{{ playbook_dir }}/../ansible/models"
    # glm53-flash-nvfp4 needs VLLM_GLM53_CUDA_SPARSE_MLA + VLLM_GLM53_MOE_INPUT_SCALE and a pinned
    # out-of-tree kernel. Without them it serves one token repeatedly.
    _preset_profiles: ["glm53-flash-nvfp4"]
    # A machine that satisfies every hardware gate, so only the new checks can fail.
    gpu_total_vram_gb: 95
    gpu_compute_cap: 12.0
    gpu_driver_major: 595
    gpu_count: 4
    gpu_name: "RTX PRO 6000 Blackwell Server Edition"
    allow_unvalidated_model: true    # isolate the extra_env/plugins refusal from requires_review
  tasks:
    - name: Load shared defaults
      ansible.builtin.include_vars: "{{ playbook_dir }}/../ansible/group_vars/all.yml"

    # group_vars/all.yml sets `swap_profiles: []` and include_vars outranks play vars, so setting
    # the list in `vars:` above would be silently wiped, every loop would skip, and this test would
    # pass by exercising nothing. set_fact after the include is what actually takes.
    - name: Select the preset under test
      ansible.builtin.set_fact:
        swap_profiles: "{{ _preset_profiles }}"

    - name: Resolve the preset, then run the role's preflights (must fail)
      block:
        - name: Resolve the preset into swap_models
          ansible.builtin.import_tasks: "{{ playbook_dir }}/../ansible/roles/llama_swap/tasks/resolve_models.yml"
        - name: Run the same preflights the role runs
          ansible.builtin.import_tasks: "{{ playbook_dir }}/../ansible/roles/llama_swap/tasks/refusals.yml"
        - name: The preflight failed to refuse
          ansible.builtin.fail:
            msg: >-
              REGRESSION: a preset containing glm53-flash-nvfp4 was accepted. That profile declares
              extra_env and vllm_plugins, neither of which the llama-swap backend command carries,
              so it would serve silently-wrong output.
      rescue:
        - name: Refused as expected
          ansible.builtin.assert:
            that: "'cannot be served faithfully' in (ansible_failed_result | to_json)"
            success_msg: "ok — the preset was refused with the expected reason"
            fail_msg: >-
              The preflight failed, but not for the expected reason. Got:
              {{ ansible_failed_result | to_json }}

- name: A requires_review entry is refused without --allow-unvalidated
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    swap_models_dir: "{{ playbook_dir }}/../ansible/models"
    _preset_profiles: ["glm53"]       # requires_review: true, 8xB200, ~36 EUR/h
    gpu_total_vram_gb: 179
    gpu_compute_cap: 10.0
    gpu_driver_major: 595
    gpu_count: 8
    gpu_name: "B200"
  tasks:
    - name: Load shared defaults
      ansible.builtin.include_vars: "{{ playbook_dir }}/../ansible/group_vars/all.yml"

    # group_vars/all.yml sets `swap_profiles: []` and include_vars outranks play vars, so setting
    # the list in `vars:` above would be silently wiped, every loop would skip, and this test would
    # pass by exercising nothing. set_fact after the include is what actually takes.
    - name: Select the preset under test
      ansible.builtin.set_fact:
        swap_profiles: "{{ _preset_profiles }}"

    - name: Resolve the preset, then run the role's preflights (must fail)
      block:
        - name: Resolve the preset into swap_models
          ansible.builtin.import_tasks: "{{ playbook_dir }}/../ansible/roles/llama_swap/tasks/resolve_models.yml"
        - name: Run the same preflights the role runs
          ansible.builtin.import_tasks: "{{ playbook_dir }}/../ansible/roles/llama_swap/tasks/refusals.yml"
        - name: The preflight failed to refuse
          ansible.builtin.fail:
            msg: >-
              REGRESSION: a preset containing the requires_review profile 'glm53' was accepted with
              no --allow-unvalidated. Single-model mode refuses this; the preset path must not be
              the cheap way around a 36 EUR/h deploy.
      rescue:
        - name: Refused as expected
          ansible.builtin.assert:
            that: "'requires_review' in (ansible_failed_result | to_json)"
            success_msg: "ok — the requires_review gate applies to presets too"
            fail_msg: >-
              The preflight failed, but not for the expected reason. Got:
              {{ ansible_failed_result | to_json }}
